<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SpeedAd - オペレーター実績詳細</title>
    <link rel="icon" href="../02_dashboard/assets/svg/speedad_logo.svg" type="image/svg+xml">
    <link rel="stylesheet" href="../02_dashboard/service-top-style.css">
    <link rel="stylesheet" href="src/admin-style.css">
    <script src="src/theme-init.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
    /* サマリ数値カード(.perf-card 系)は src/admin-style.css へ集約(user-detail/survey-detail 等と同じ方針) */
    .perf-sec { margin-top: 24px; font-size: 13px; font-weight: 700; color: var(--a-fg); }
    .perf-sec-note { margin-left: 8px; font-weight: 400; font-size: 12px; color: var(--a-fg-muted2); }
    .perf-table { margin-top: 10px; background: var(--a-surface); border: 1px solid var(--a-border); border-radius: 8px; overflow-x: auto; }
    /* 日別実績は行数が多いので高さを絞ってスクロールさせる */
    .perf-daily-scroll { max-height: 420px; overflow-y: auto; }
</style>
<!-- スマホ段(640px以下)の列間引きは行わない(2026-08-19)。本ページの月次推移・内訳・
     アンケート別・日別はここより深い遷移先が無い終端の表で、正解件数・スキップ回数・
     報酬金額を列から隠すとスマホで見る手段が消えるため。当月分はサマリカードで見え、
     過去月・内訳は横スクロール(data-phone-scroll)で全列を保持する(05 §6.2)。 -->
</head>
<body>
<div class="relative flex min-h-screen flex-col overflow-x-hidden">
    <div id="mobileSidebarOverlay" class="mobile-sidebar-overlay lg:hidden"></div>
    <div id="header-placeholder"></div>
    <div class="flex flex-1" style="padding-top:56px">
        <div id="sidebar-placeholder"></div>
        <main class="flex-1 min-w-0" id="main-content" data-page-min-lv="2" data-nav="performance-management.html">
          <div style="padding:18px 24px 40px">
            <div style="font-size:12px;color:var(--a-fg-muted2)"><a href="index.html">ホーム</a> › <a href="performance-management.html">オペレーター実績確認</a> › <span style="color:var(--a-fg-strong)">オペレーター実績詳細</span></div>
            <div style="display:flex;align-items:center;justify-content:space-between;margin-top:6px;padding-bottom:14px;border-bottom:2px solid var(--a-border);flex-wrap:wrap;row-gap:8px">
              <div>
                <h1 style="margin:0;font-size:20px;font-weight:700"><span data-slot="opname">オペレーター実績詳細</span><span data-slot="opid" style="margin-left:10px;font-size:13px;font-weight:400;color:var(--a-fg-muted2)"></span></h1>
                <div style="margin-top:4px;font-size:12.5px;color:var(--a-fg-muted)">所属グループ: <a data-slot="opgroup" href="#"></a></div>
              </div>
              <div style="display:flex;align-items:center;gap:14px">
                <label style="display:flex;align-items:center;gap:8px;font-size:13px;color:var(--a-fg-muted)">対象期間
                  <select id="odMonth" onchange="odSetMonth(this.value)" style="border:1px solid var(--a-border-strong);border-radius:6px;padding:8px 10px;font-size:13px;font-family:inherit;color:var(--a-fg-strong)"><option value="2026-07">2026/07(当月)</option><option value="2026-06">2026/06</option><option value="2026-05">2026/05</option></select>
                </label>
                <button onclick="location.href='performance-management.html'" style="background:var(--a-surface);color:var(--a-fg);border:1px solid var(--a-border-strong);border-radius:6px;padding:9px 18px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit">‹ 一覧へ戻る</button>
              </div>
            </div>

            <div class="perf-sec" style="margin-top:18px">当月サマリ <span class="perf-sec-note">報酬金額 = 作業件数 × 単価50円(モックの仮単価)</span></div>
            <div id="poSummary" data-a-region="summary" class="perf-cards">
              <div class="perf-card"><div class="perf-card-label">作業件数</div><div class="perf-card-num" data-card="w">—</div></div>
              <div class="perf-card"><div class="perf-card-label">正解件数</div><div class="perf-card-num" data-card="o">—</div></div>
              <div class="perf-card"><div class="perf-card-label">正答率</div><div class="perf-card-num" data-card="r">—</div></div>
              <div class="perf-card"><div class="perf-card-label">スキップ回数</div><div class="perf-card-num" data-card="s">—</div></div>
              <div class="perf-card"><div class="perf-card-label">報酬金額</div><div class="perf-card-num" data-card="pay">—</div></div>
            </div>

            <div class="perf-sec">月次推移 <span class="perf-sec-note">直近6ヶ月。行は新しい月が上</span></div>
            <div class="perf-table" data-phone-scroll>
              <div data-grid="trend" style="background:var(--a-surface-2);border-bottom:1px solid var(--a-border);font-size:12px;font-weight:700;color:var(--a-fg-muted);height:40px">
                <span>対象月</span><span style="text-align:right">作業件数</span><span style="text-align:right">正解件数</span><span style="text-align:right">正答率</span><span style="text-align:right">スキップ回数</span><span style="text-align:right">報酬金額</span>
              </div>
              <div id="odTrend"></div>
            </div>

            <div class="perf-sec">作業グループ①〜⑧×入力項目別の内訳 <span class="perf-sec-note">作業グループ行を押すと入力項目ごとの内訳を開きます</span></div>
            <div class="perf-table" data-phone-scroll>
              <div data-grid="bd" style="background:var(--a-surface-2);border-bottom:1px solid var(--a-border);font-size:12px;font-weight:700;color:var(--a-fg-muted);height:40px">
                <span>作業グループ / 入力項目</span><span style="text-align:right">作業件数</span><span style="text-align:right">正解件数</span><span style="text-align:right">正答率</span><span style="text-align:right">スキップ回数</span><span style="text-align:right">報酬金額</span>
              </div>
              <div id="odBreakdown"></div>
            </div>

            <div class="perf-sec">内訳 <span class="perf-sec-note" id="odBreakNote">担当した案件ごとの内訳</span></div>
            <div role="tablist" aria-label="内訳の切り替え" style="display:flex;gap:2px;border-bottom:2px solid var(--a-border)">
              <button id="odTabSv" role="tab" aria-selected="true" aria-controls="odDetailPane" onclick="odTab('survey')" style="background:none;border:none;border-bottom:2px solid var(--a-accent);margin-bottom:-2px;padding:10px 18px;font-size:13.5px;font-weight:700;color:var(--a-accent);cursor:pointer;font-family:inherit">アンケート別</button>
              <button id="odTabDay" role="tab" aria-selected="false" aria-controls="odDetailPane" onclick="odTab('daily')" style="background:none;border:none;border-bottom:2px solid transparent;margin-bottom:-2px;padding:10px 18px;font-size:13.5px;color:var(--a-fg-muted);cursor:pointer;font-family:inherit">日別</button>
            </div>
            <section id="odDetailPane" role="tabpanel" aria-labelledby="odTabSv" class="perf-table perf-daily-scroll" data-phone-scroll style="margin-top:12px">
              <div id="odDetailHead" data-grid="survey" style="position:sticky;top:0;background:var(--a-surface-2);border-bottom:1px solid var(--a-border);font-size:12px;font-weight:700;color:var(--a-fg-muted);height:40px"></div>
              <div id="odDaily"></div>
            </section>

            <div id="odDetailNote" style="margin-top:12px;font-size:11.5px;color:var(--a-fg-faint)"></div>
          </div>
        </main>
    </div>
</div>

<script type="module" src="src/admin.js"></script>
<script src="src/proto-ui.js"></script>
<script src="src/proto-level.js"></script>
<script src="src/perf-data.js"></script>
<script>
// オペレーター実績詳細(モック)。?oid=OP-#### で対象を受け取り、サマリ・推移・内訳・日別を描く
(function () {
    'use strict';
    var D = window.PerfData;
    var q = new URLSearchParams(location.search);
    var oid = q.get('oid');
    // 指定が無ければ既定表示、指定があって実在しなければ「見つかりません」(存在しないIDへ黙ってフォールバックしない)
    if (oid && !D.PERF[oid]) { window.pNotFound('オペレーター', oid, 'performance-management.html', 'オペレーター実績確認へ戻る'); return; }
    // Lv2は自グループ配下のオペレーターのみ閲覧可(00号§5)。他社オペレーターIDをURLで直打ちされても、存在しない体で扱う(別レコードを黙って出さない)
    if (oid && window.pLevel() === 2 && D.GROUPS[D.opGroup(oid)].name !== window.pAccountGroup()) { window.pNotFound('オペレーター', oid, 'performance-management.html', 'オペレーター実績確認へ戻る'); return; }
    if (!D.PERF[oid]) { oid = 'OP-0058'; }
    var month = '2026-07';
    var openG = -1; // 展開中の作業グループ(①〜⑧)の添字。-1は全閉
    var detailTab = 'survey'; // 内訳の下段。survey(アンケート別・既定) / daily(日別)

    function esc(s) {
        return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    var GRIDS = {
        trend: 'display:grid;grid-template-columns:minmax(130px,120fr) minmax(130px,70fr) minmax(130px,70fr) minmax(100px,52fr) minmax(140px,70fr) minmax(150px,70fr);align-items:center;padding:0 18px',
        bd: 'display:grid;grid-template-columns:minmax(240px,230fr) minmax(130px,70fr) minmax(130px,70fr) minmax(100px,52fr) minmax(140px,70fr) minmax(150px,70fr);align-items:center;padding:0 18px',
        daily: 'display:grid;grid-template-columns:minmax(130px,120fr) minmax(130px,70fr) minmax(130px,70fr) minmax(100px,52fr) minmax(140px,70fr);align-items:center;padding:0 18px',
        // 案件名は長いので1列目を広く取る。数値列は日別と同じ幅で揃え、タブを切り替えても列がずれないようにする
        survey: 'display:grid;grid-template-columns:minmax(280px,300fr) minmax(130px,70fr) minmax(130px,70fr) minmax(100px,52fr) minmax(140px,70fr);align-items:center;padding:0 18px'
    };
    document.querySelectorAll('[data-grid]').forEach(function (el) {
        el.setAttribute('style', GRIDS[el.getAttribute('data-grid')] + ';' + el.getAttribute('style'));
    });

    function cell(v, right, extra) {
        return '<span style="' + (right ? 'text-align:right;' : '') + (extra || '') + '">' + v + '</span>';
    }
    function rateCell(o, w, bold) {
        var rt = D.rate(o, w);
        var warn = (w && parseInt(rt, 10) < 95) ? 'color:var(--a-warn);' : '';
        return cell(rt, true, warn + (bold ? 'font-weight:700;' : ''));
    }

    function renderBreakdown() {
        var d = D.PERF[oid].m[month];
        var host = document.getElementById('odBreakdown');
        if (!d) {
            host.innerHTML = '<div style="padding:22px 18px;text-align:center;font-size:13px;color:var(--a-fg-faint)">この月の内訳データはありません。</div>';
            return;
        }
        var body = '';
        d.rows.forEach(function (g, gi) {
            var mark = (openG === gi) ? '▾ ' : '▸ ';
            body += '<div tabindex="0" role="button" aria-expanded="' + (openG === gi) + '" onclick="odToggleGroup(' + gi + ')"'
                + ' class="proto-row-hover" style="' + GRIDS.bd + ';height:38px;border-bottom:1px solid var(--a-border-soft);font-size:12.5px;font-variant-numeric:tabular-nums;cursor:pointer">'
                + cell(mark + g.n, false, 'font-weight:700') + cell(D.num(g.w), true) + cell(D.num(g.o), true)
                + rateCell(g.o, g.w, true) + cell(D.num(g.s), true) + cell(D.num(g.w * D.UNIT) + ' 円', true) + '</div>';
            if (openG === gi) {
                g.sub.forEach(function (it) {
                    body += '<div style="' + GRIDS.bd + ';height:34px;border-bottom:1px solid var(--a-border-soft);font-size:12px;font-variant-numeric:tabular-nums;background:var(--a-surface-2)">'
                        + cell(it.n, false, 'padding-left:22px;color:var(--a-fg-muted)') + cell(D.num(it.w), true) + cell(D.num(it.o), true)
                        + rateCell(it.o, it.w) + cell(D.num(it.s), true) + cell(D.num(it.w * D.UNIT) + ' 円', true) + '</div>';
                });
            }
        });
        host.innerHTML = body;
    }

    function paint() {
        // Lv1ではページ本文がガード表示に差し替えられるため描画しない
        if (!document.querySelector('[data-slot="opname"]')) { return; }
        var p = D.PERF[oid];
        var gid = D.opGroup(oid);
        var t = D.totals(oid, month);
        document.querySelector('[data-slot="opname"]').textContent = p.name;
        document.querySelector('[data-slot="opid"]').textContent = oid;
        var ga = document.querySelector('[data-slot="opgroup"]');
        ga.textContent = D.GROUPS[gid].name;
        ga.href = 'performance-group-detail.html?group=' + gid;
        document.title = 'SpeedAd - オペレーター実績詳細 ' + p.name;
        function card(k, v, unit) {
            document.querySelector('[data-card="' + k + '"]').innerHTML =
                v + (unit ? '<span class="perf-card-unit">' + unit + '</span>' : '');
        }
        card('w', D.num(t.w), '件'); card('o', D.num(t.o), '件'); card('r', D.rate(t.o, t.w));
        card('s', D.num(t.s), '回'); card('pay', D.num(t.w * D.UNIT), '円');

        // 月次推移(新→旧)。表示中の月の行を淡く強調する
        var trend = '';
        D.TREND_MONTHS.forEach(function (m) {
            var x = D.totals(oid, m);
            var cur = (m === month) ? 'background:var(--a-surface-hover);' : '';
            trend += '<div style="' + GRIDS.trend + ';height:42px;border-bottom:1px solid var(--a-border-soft);font-size:13px;font-variant-numeric:tabular-nums;' + cur + '">'
                + cell(m.replace('-', '/'), false, 'font-weight:500')
                + cell(D.num(x.w), true) + cell(D.num(x.o), true) + rateCell(x.o, x.w, true)
                + cell(D.num(x.s), true) + cell(D.num(x.w * D.UNIT) + ' 円', true) + '</div>';
        });
        document.getElementById('odTrend').innerHTML = trend;

        renderBreakdown();

        renderDetail();
    }

    // 内訳の下段。アンケート別と日別は同じ月合計を別の軸で割ったもので、どちらも合計は一致する。
    // 案件別は「どの案件にどれだけ手が入ったか」、日別は「いつ稼働したか」を見るためのもの
    function renderDetail() {
        var head = document.getElementById('odDetailHead');
        var body = document.getElementById('odDaily');
        var note = document.getElementById('odDetailNote');
        var sec = document.getElementById('odBreakNote');
        var rowStyle = ';height:36px;border-bottom:1px solid var(--a-border-soft);font-size:12.5px;font-variant-numeric:tabular-nums';
        // 中身を入れ替えるので先頭へ戻す。日別(行数が多い)で下までスクロールしたまま
        // アンケート別へ切り替えると、途中から表示されて先頭の案件が見えない。
        // 横位置も戻す。幅が狭いと表が横スクロールするため、月を切り替えたときに
        // 右へ寄ったままになり、1列目のアンケート名が隠れる
        var pane = document.getElementById('odDetailPane');
        if (pane) { pane.scrollTop = 0; pane.scrollLeft = 0; }

        if (detailTab === 'survey') {
            head.setAttribute('data-grid', 'survey');
            head.setAttribute('style', GRIDS.survey + ';position:sticky;top:0;background:var(--a-surface-2);border-bottom:1px solid var(--a-border);font-size:12px;font-weight:700;color:var(--a-fg-muted);height:40px');
            head.innerHTML = '<span>アンケート</span><span style="text-align:right">作業件数</span><span style="text-align:right">正解件数</span>'
                + '<span style="text-align:right">正答率</span><span style="text-align:right">スキップ回数</span>';
            var rows = D.surveys(oid, month);
            body.innerHTML = rows.length ? rows.map(function (r) {
                return '<div style="' + GRIDS.survey + rowStyle + '">'
                    + '<span style="min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding-right:10px" title="' + esc(r.sid + ' ' + r.title) + '">'
                    + '<a href="survey-detail.html?id=' + r.sid + '">' + r.sid + '</a> ' + esc(r.title) + '</span>'
                    + cell(D.num(r.w), true) + cell(D.num(r.o), true) + rateCell(r.o, r.w) + cell(D.num(r.s), true) + '</div>';
            }).join('') : '<div style="padding:16px 18px;font-size:12.5px;color:var(--a-fg-faint)">この月に担当した案件はありません。</div>';
            sec.textContent = '担当した案件ごとの内訳';
            note.innerHTML = '正答率は 95% 未満を<span style="color:var(--a-warn);font-weight:700">この色</span>で示す。'
                + '案件別は名刺の所属アンケートを基準に集計する。合計は当月サマリと一致する。';
            return;
        }

        head.setAttribute('data-grid', 'daily');
        head.setAttribute('style', GRIDS.daily + ';position:sticky;top:0;background:var(--a-surface-2);border-bottom:1px solid var(--a-border);font-size:12px;font-weight:700;color:var(--a-fg-muted);height:40px');
        head.innerHTML = '<span>日付</span><span style="text-align:right">作業件数</span><span style="text-align:right">正解件数</span>'
            + '<span style="text-align:right">正答率</span><span style="text-align:right">スキップ回数</span>';
        body.innerHTML = D.daily(oid, month).map(function (r) {
            return '<div style="' + GRIDS.daily + rowStyle + '">'
                + cell(month.replace('-', '/') + '/' + String(r.d).padStart(2, '0') + '(' + r.dow + ')', false)
                + cell(D.num(r.w), true) + cell(D.num(r.o), true) + rateCell(r.o, r.w) + cell(D.num(r.s), true) + '</div>';
        }).join('');
        sec.textContent = '土日を除く稼働日ごとの内訳';
        note.innerHTML = '正答率は 95% 未満を<span style="color:var(--a-warn);font-weight:700">この色</span>で示す。'
            + '日別は入力を確定した日を基準に集計する。合計は当月サマリと一致する。';
    }

    var TABS = { survey: 'odTabSv', daily: 'odTabDay' };
    window.odTab = function (name) {
        if (!TABS[name]) { return; }
        detailTab = name;
        Object.keys(TABS).forEach(function (k) {
            var on = (k === name);
            var btn = document.getElementById(TABS[k]);
            if (!btn) { return; }
            btn.setAttribute('aria-selected', on ? 'true' : 'false');
            btn.style.borderBottomColor = on ? 'var(--a-accent)' : 'transparent';
            btn.style.color = on ? 'var(--a-accent)' : 'var(--a-fg-muted)';
            btn.style.fontWeight = on ? '700' : '400';
        });
        var pane = document.getElementById('odDetailPane');
        if (pane) { pane.setAttribute('aria-labelledby', TABS[name]); }
        renderDetail();
    };

    window.odToggleGroup = function (gi) {
        openG = (openG === gi) ? -1 : gi;
        renderBreakdown();
    };
    window.odSetMonth = function (m) { month = m; openG = -1; paint(); };
    document.addEventListener('DOMContentLoaded', paint);
    if (document.readyState !== 'loading') { paint(); }
})();
</script>

</body>
</html>
