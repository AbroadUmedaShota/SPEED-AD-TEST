<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SPEED AD ロゴ SVG エディタ</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="site-header">
    <div>
      <h1>ロゴ SVG エディタ</h1>
    </div>
    <p id="status" class="status" aria-live="polite">SVGを読み込んでください</p>
  </header>

  <main class="workspace">
    <aside class="panel controls-panel" aria-label="編集操作">
      <section>
        <h2>確定文字を選ぶ</h2>
        <label class="field-label" for="presetSelect">編集する文字</label>
        <div class="preset-controls">
          <select id="presetSelect" aria-label="確定文字SVG"></select>
          <button id="loadPresetButton" type="button">読み込む</button>
        </div>
        <button id="resetButton" class="secondary-button" type="button" disabled>この文字を元の形に戻す</button>
        <p class="panel-help">起動時は最新のSを読み込みます。D1/D2、E1/E2は個別のファイル名で保存できます。</p>
      </section>
      <section>
        <h2>別のSVGを読み込む</h2>
        <label class="file-button" for="svgFile">SVGファイルを選択</label>
        <input id="svgFile" type="file" accept="image/svg+xml,.svg">
        <div id="dropZone" class="drop-zone" tabindex="0">ここへSVGをドラッグ＆ドロップ</div>
      </section>
      <section class="toolbar" aria-label="表示と履歴">
        <h2>表示・履歴</h2>
        <div class="button-grid">
          <button id="undoButton" type="button" disabled>元に戻す</button>
          <button id="redoButton" type="button" disabled>やり直す</button>
          <button id="zoomOutButton" type="button" aria-label="縮小">－</button>
          <button id="zoomInButton" type="button" aria-label="拡大">＋</button>
          <button id="fitButton" type="button">全体表示</button>
          <button id="nodesButton" type="button" aria-pressed="true">ノード表示: ON</button>
        </div>
        <label class="node-size-field" for="nodeSizeSelect">
          ポイントサイズ
          <select id="nodeSizeSelect">
            <option value="small" selected>小</option>
            <option value="medium">中</option>
            <option value="large">大</option>
          </select>
        </label>
      </section>
      <section>
        <h2>パスとサブパス</h2>
        <ol id="pathList" class="path-list" aria-label="パス一覧"></ol>
      </section>
    </aside>

    <section class="editor" aria-label="SVG編集キャンバス">
      <div id="canvasFrame" class="canvas-frame">
        <svg id="canvas" role="img" aria-label="読み込んだSVGの編集キャンバス" tabindex="0"></svg>
        <p id="emptyMessage" class="empty-message">SVGを読み込むと、ここでパスとノードを直接編集できます。</p>
      </div>
      <p class="shortcut-help">ノードを選択後、矢印キーで1px、Shift＋矢印キーで10px移動できます。Ctrl＋Z / Ctrl＋Y（または Ctrl＋Shift＋Z）に対応しています。</p>
    </section>

    <aside class="panel inspector" aria-label="選択ノードの編集">
      <section>
        <h2>選択中</h2>
        <p id="selectionSummary">未選択</p>
      </section>
      <section id="coordinateSection" hidden>
        <h2 id="pointTitle">座標</h2>
        <div class="coordinate-fields">
          <label>X<input id="xInput" type="number" step="0.1"></label>
          <label>Y<input id="yInput" type="number" step="0.1"></label>
        </div>
        <div class="button-grid">
          <button id="lineButton" type="button">直線化</button>
          <button id="curveButton" type="button">曲線化</button>
        </div>
      </section>
      <section class="node-list-section">
        <h2>ノード</h2>
        <ol id="nodeList" class="node-list" aria-label="選択サブパスのノード"></ol>
      </section>
      <section class="download-section">
        <h2>書き出し</h2>
        <button id="downloadButton" type="button" disabled>編集済みSVGをダウンロード</button>
      </section>
    </aside>
  </main>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script type="module" src="app.js"></script>
</body>
</html>
